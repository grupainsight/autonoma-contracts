openapi: 3.1.0
info:
  title: Autonoma API
  version: "1.0"
  description: |
    Platform API for Autonoma multi-agent marketing system.
    Consumers: WordPress plugin, future Shopify/PrestaShop plugins, SaaS dashboard.
    Auth: Bearer token in format aut_live_<key_id>.<secret>.
    Token identifies client - no client_id in URL.

servers:
  - url: https://autonoma-api-production.up.railway.app
    description: Production (Railway)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Token format: aut_live_<key_id>.<secret>"

  schemas:
    DashboardResponse:
      type: object
      required: [api_version, generated_at, client, modules, alerts, recommendations]
      properties:
        api_version:
          type: string
          example: "1.0"
        generated_at:
          type: string
          format: date-time
        client:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        modules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DashboardModule"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
          description: "Derived from recommendations with status IN (NEW, ACKNOWLEDGED, APPROVED, IN_PROGRESS) AND (impact IN (HIGH, CRITICAL) OR type = ACTION). Not a separate data source."
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationSummary"

    DashboardModule:
      type: object
      required: [status, summary, last_successful_run, data_period, sources, confidence, metrics, top_issue, stale]
      properties:
        status:
          type: string
          enum: [ok, warning, critical, error, no_data]
        summary:
          type: string
        last_successful_run:
          type: string
          format: date-time
        data_period:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        sources:
          type: object
          additionalProperties:
            type: object
            properties:
              last_successful_run:
                type: string
                format: date-time
              stale_after_seconds:
                type: integer
              stale:
                type: boolean
                description: "Computed by API: now > last_successful_run + stale_after_seconds"
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        stale:
          type: boolean
          description: "Computed by API. True if ANY source is stale."
        metrics:
          type: object
          additionalProperties: true
        top_issue:
          oneOf:
            - type: object
              properties:
                title:
                  type: string
                impact:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
            - type: "null"

    Alert:
      type: object
      description: "A view on high-impact recommendations - not a separate entity."
      properties:
        id:
          type: string
        module:
          type: string
        severity:
          type: string
          enum: [warning, critical]
        message:
          type: string
        created_at:
          type: string
          format: date-time

    RecommendationSummary:
      type: object
      properties:
        id:
          type: string
        source_agent:
          type: string
        type:
          type: string
          enum: [INSIGHT, RECOMMENDATION, ACTION]
        status:
          type: string
          enum: [NEW, ACKNOWLEDGED, APPROVED, REJECTED, IN_PROGRESS, COMPLETED, WITHDRAWN, EXPIRED]
        title:
          type: string
        summary:
          type: string
        impact:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        confidence:
          type: integer
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        occurrence_count:
          type: integer
        created_at:
          type: string
          format: date-time

    RecommendationDetail:
      allOf:
        - $ref: "#/components/schemas/RecommendationSummary"
        - type: object
          properties:
            recommended_action:
              type: string
            reason_codes:
              type: array
              items:
                type: string
            evidence:
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                  data:
                    type: object
            requires_approval:
              type: boolean
            dedupe_key:
              type: string
            supersedes_recommendation_id:
              type: string
            expires_at:
              type: string
              format: date-time
            events:
              type: array
              items:
                $ref: "#/components/schemas/RecommendationEvent"

    RecommendationEvent:
      type: object
      properties:
        id:
          type: string
        previous_status:
          type: string
        new_status:
          type: string
        actor_type:
          type: string
          enum: [AGENT, CLIENT_USER, GI_USER, SYSTEM]
        source:
          type: string
          enum: [agent, plugin, email, api, system]
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

paths:
  /api/v1/dashboard:
    get:
      summary: Get aggregated dashboard
      description: |
        Returns all active modules, alerts and recommendations for the client
        identified by the Bearer token. Field 'stale' is computed at read time.
        Alerts are derived from high-impact recommendations - not a separate data source.
      operationId: getDashboard
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Token suspended or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/recommendations/{id}:
    get:
      summary: Get recommendation detail
      description: Returns full recommendation with evidence, events and lifecycle history.
      operationId: getRecommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recommendation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationDetail"
        "404":
          description: Recommendation not found or not owned by client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/recommendations/{id}/acknowledge:
    post:
      summary: Acknowledge a recommendation
      description: |
        Marks a RECOMMENDATION as seen by the client.
        Legal transition: NEW -> ACKNOWLEDGED.
        Sprint 1.5 - the only action available in MVP plugin.
      operationId: acknowledgeRecommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationDetail"
        "409":
          description: Illegal status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Sprint 2 endpoints - defined but not implemented in v1.0
  /api/v1/recommendations/{id}/approve:
    post:
      summary: "[Sprint 2] Approve an ACTION"
      description: "Legal transition: NEW -> APPROVED (for ACTIONs only)"
      operationId: approveRecommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          description: Not implemented in v1.0

  /api/v1/recommendations/{id}/reject:
    post:
      summary: "[Sprint 2] Reject a recommendation"
      description: "Legal transition: NEW -> REJECTED, ACKNOWLEDGED -> REJECTED"
      operationId: rejectRecommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          description: Not implemented in v1.0
